<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Sakura Petal Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="35%" stop-color="#fda4af"/>
      <stop offset="85%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>

    <!-- Single Sakura Petal with the iconic notched tip -->
    <path id="sakuraPetal"
      d="M 16 16 
         C 12.2 13.5, 10.5 7.5, 13.8 3.5 
         C 14.8 2.3, 15.5 3.8, 16 5.2 
         C 16.5 3.8, 17.2 2.3, 18.2 3.5 
         C 21.5 7.5, 19.8 13.5, 16 16 Z"
      fill="url(#petalGrad)"
      stroke="#f43f5e"
      stroke-width="0.5"
      stroke-linejoin="round"
    />
  </defs>

  <!-- 5 Rotated Sakura Petals -->
  <g id="petals">
    <use href="#sakuraPetal" />
    <use href="#sakuraPetal" transform="rotate(72 16 16)" />
    <use href="#sakuraPetal" transform="rotate(144 16 16)" />
    <use href="#sakuraPetal" transform="rotate(216 16 16)" />
    <use href="#sakuraPetal" transform="rotate(288 16 16)" />
  </g>

  <!-- Inner Soft Pink Glow -->
  <circle cx="16" cy="16" r="5.2" fill="url(#centerGlow)" />

  <!-- Stamens & Golden Pollen Dots -->
  <g stroke="#e11d48" stroke-width="0.8" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="10" />
    <line x1="16" y1="16" x2="21.7" y2="12.1" />
    <line x1="16" y1="16" x2="19.5" y2="20.8" />
    <line x1="16" y1="16" x2="12.5" y2="20.8" />
    <line x1="16" y1="16" x2="10.3" y2="12.1" />

    <!-- Intermediate subtle stamens -->
    <line x1="16" y1="16" x2="18.8" y2="11.2" stroke-width="0.6" stroke="#fb7185" />
    <line x1="16" y1="16" x2="20.8" y2="16.5" stroke-width="0.6" stroke="#fb7185" />
    <line x1="16" y1="16" x2="16" y2="21.2" stroke-width="0.6" stroke="#fb7185" />
    <line x1="16" y1="16" x2="11.2" y2="16.5" stroke-width="0.6" stroke="#fb7185" />
    <line x1="16" y1="16" x2="13.2" y2="11.2" stroke-width="0.6" stroke="#fb7185" />
  </g>

  <!-- Golden Pollen Tips -->
  <g fill="#fbbf24">
    <circle cx="16" cy="9.5" r="0.9" />
    <circle cx="22.2" cy="11.8" r="0.9" />
    <circle cx="19.8" cy="21.3" r="0.9" />
    <circle cx="12.2" cy="21.3" r="0.9" />
    <circle cx="9.8" cy="11.8" r="0.9" />
  </g>

  <!-- Center Pistil Core -->
  <circle cx="16" cy="16" r="1.5" fill="#e11d48" />
  <circle cx="16" cy="16" r="0.8" fill="#fbbf24" />
</svg>
